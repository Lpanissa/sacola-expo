<svg xmlns="http://www.w3.org/2000/svg" viewBox="126 108 264 306">
  <!-- Logo do app (o mesmo desenho do ícone, sem o fundo verde): sacola de
       papel com baguete, leite, verduras e maçã. Usado no topo e na tela vazia. -->
  <!-- Produtos (atrás da sacola) -->
  <!-- baguete -->
  <g transform="rotate(-18 190 200)">
    <rect x="168" y="118" width="44" height="150" rx="22" fill="#F4B860"/>
    <path d="M180 150l20-12M180 180l20-12M180 210l20-12" stroke="#D9913A" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- caixa de leite -->
  <g>
    <rect x="236" y="128" width="30" height="18" rx="4" fill="#E9F3FF"/>
    <path d="M222 170 l14 -26 h30 l14 26 v90 h-58 z" fill="#FFFFFF"/>
    <rect x="222" y="188" width="58" height="26" fill="#5AA2E0"/>
  </g>
  <!-- folhas / verduras -->
  <g transform="rotate(20 318 196)">
    <path d="M318 262 C 290 220, 296 160, 318 128 C 340 160, 346 220, 318 262 Z" fill="#1F7A5A"/>
    <path d="M318 262 C 300 230, 272 196, 262 168 C 296 176, 318 214, 318 262 Z" fill="#26956D"/>
  </g>
  <!-- maçã -->
  <circle cx="352" cy="232" r="30" fill="#F2543D"/>
  <path d="M352 204 q4 -16 18 -18 q-2 14 -18 18z" fill="#1F7A5A"/>

  <!-- Sacola (na frente), marrom claro como sacola de papel kraft -->
  <path d="M136 240 h240 l-16 150 a18 18 0 0 1 -18 16 h-172 a18 18 0 0 1 -18 -16 z" fill="#D9B48A"/>
  <!-- dobra da boca da sacola -->
  <path d="M136 240 h240 l-3 26 h-234 z" fill="#C49A6C"/>
  <!-- alças -->
  <path d="M196 290 v-12 M316 290 v-12" stroke="#8B5E3C" stroke-width="10" stroke-linecap="round"/>
</svg>
