<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Silhuetas de bomboniere (usadas como máscara; a cor vem do CSS) -->
  <!-- pirulito -->
  <g transform="rotate(-15 45 50)">
    <circle cx="45" cy="40" r="22"/>
    <rect x="42" y="60" width="6" height="40" rx="3"/>
  </g>
  <!-- bala embrulhada -->
  <g transform="rotate(20 165 45)">
    <ellipse cx="165" cy="45" rx="22" ry="14"/>
    <path d="M143 45 l-16 -12 v24 z M187 45 l16 -12 v24 z"/>
  </g>
  <!-- barra de chocolate -->
  <g transform="rotate(12 200 150)">
    <path d="M176 120 h48 v64 h-48 z M180 124 v12 h18 v-12 z M202 124 v12 h18 v-12 z M180 140 v12 h18 v-12 z M202 140 v12 h18 v-12 z" fill-rule="evenodd"/>
  </g>
  <!-- cupcake -->
  <g transform="rotate(-8 70 170)">
    <path d="M44 162 q0 -28 26 -28 q26 0 26 28 z"/>
    <circle cx="70" cy="128" r="6"/>
    <path d="M46 166 h48 l-8 34 h-32 z"/>
  </g>
  <!-- pirulito espiral pequeno -->
  <g transform="rotate(30 130 215)">
    <circle cx="130" cy="205" r="13"/>
    <rect x="128" y="216" width="4" height="22" rx="2"/>
  </g>
  <!-- bolinhas de confeito -->
  <circle cx="120" cy="100" r="5"/>
  <circle cx="135" cy="115" r="4"/>
  <circle cx="112" cy="125" r="3"/>
</svg>
