<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Silhuetas de feira: frutas e legumes (usadas como máscara; a cor vem do CSS) -->
  <!-- cenoura -->
  <g transform="rotate(-30 40 50)">
    <path d="M30 34 h20 l-10 56 Z"/>
    <path d="M40 34 q-10 -14 -4 -20 q2 10 4 14 q2 -12 10 -14 q0 10 -6 20 Z"/>
  </g>
  <!-- banana -->
  <path d="M120 30 q40 10 44 50 q-2 4 -6 2 q-8 -30 -40 -44 q-2 -6 2 -8 Z"/>
  <!-- uvas -->
  <g>
    <circle cx="206" cy="30" r="8"/><circle cx="222" cy="30" r="8"/>
    <circle cx="198" cy="44" r="8"/><circle cx="214" cy="44" r="8"/><circle cx="230" cy="44" r="8"/>
    <circle cx="206" cy="58" r="8"/><circle cx="222" cy="58" r="8"/>
    <circle cx="214" cy="72" r="8"/>
  </g>
  <!-- pera -->
  <g transform="rotate(15 60 160)">
    <circle cx="60" cy="176" r="20"/>
    <circle cx="60" cy="150" r="12"/>
    <rect x="58" y="128" width="4" height="12" rx="2"/>
  </g>
  <!-- tomate -->
  <circle cx="150" cy="140" r="20"/>
  <path d="M140 118 l10 6 l10 -6 l-4 10 h-12 Z"/>
  <!-- fatia de melancia -->
  <g transform="rotate(-15 190 200)">
    <path d="M160 190 a30 30 0 0 0 60 0 Z"/>
  </g>
  <!-- ervilha / folha -->
  <g transform="rotate(35 110 215)">
    <ellipse cx="110" cy="215" rx="22" ry="9"/>
  </g>
</svg>
