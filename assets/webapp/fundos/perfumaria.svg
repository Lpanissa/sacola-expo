  <circle cx="112" cy="122" r="4"/>
  <!-- pente -->
  <g transform="rotate(25 160 190)">
    <rect x="124" y="178" width="72" height="12" rx="6"/>
    <path d="M130 190 h4 v16 h-4 z M142 190 h4 v16 h-4 z M154 190 h4 v16 h-4 z M166 190 h4 v16 h-4 z M178 190 h4 v16 h-4 z M190 190 h4 v12 h-4 z"/>
  </g>
  <!-- brilhinho -->
  <path d="M110 220 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
  <path d="M226 190 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
