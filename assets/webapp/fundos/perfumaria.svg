<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Silhuetas de perfumaria (usadas como máscara; a cor vem do CSS) -->
  <!-- frasco de perfume -->
  <g transform="rotate(-10 44 60)">
    <rect x="36" y="16" width="16" height="12" rx="3"/>
    <rect x="41" y="28" width="6" height="8"/>
    <rect x="20" y="36" width="48" height="50" rx="12"/>
  </g>
  <!-- batom -->
  <g transform="rotate(18 150 50)">
    <rect x="138" y="52" width="24" height="36" rx="4"/>
    <rect x="141" y="36" width="18" height="16" rx="2"/>
    <path d="M143 36 v-12 l14 -8 v20 z"/>
  </g>
  <!-- esmalte -->
  <g transform="rotate(-8 214 110)">
    <rect x="206" y="72" width="16" height="30" rx="4"/>
    <rect x="196" y="102" width="36" height="34" rx="10"/>
