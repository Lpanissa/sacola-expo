<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Silhuetas de shopping (usadas como máscara; a cor vem do CSS) -->
  <!-- sacola de compras -->
  <g transform="rotate(-10 46 60)">
    <path d="M34 40 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
    <path d="M18 40 h56 l-4 50 h-48 z"/>
  </g>
  <!-- cabide -->
  <g transform="rotate(8 160 50)" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 26 a8 8 0 1 1 8 8 v6 l38 24 h-92 l38 -24"/>
  </g>
  <!-- camiseta -->
  <g transform="rotate(12 196 150)">
    <path d="M176 120 l-20 12 l8 16 l10 -5 v38 h44 v-38 l10 5 l8 -16 l-20 -12 q-10 10 -20 0 z"/>
  </g>
  <!-- sapato de salto -->
  <g transform="rotate(-6 70 176)">
    <path d="M30 186 q10 -30 26 -34 q6 14 18 16 q24 2 36 12 q4 6 -4 8 h-44 q-8 -8 -16 -2 l-2 18 h-8 l-2 -18 z"/>
  </g>
  <!-- etiqueta de preço -->
  <g transform="rotate(30 120 110)">
    <path d="M100 96 h34 l14 14 l-14 14 h-34 z M140 110 a4 4 0 1 0 0.1 0 z" fill-rule="evenodd"/>
  </g>
  <!-- óculos de sol -->
  <g transform="rotate(-12 170 220)">
    <ellipse cx="150" cy="222" rx="14" ry="10"/>
    <ellipse cx="188" cy="222" rx="14" ry="10"/>
    <rect x="162" y="216" width="14" height="4" rx="2"/>
  </g>
</svg>
