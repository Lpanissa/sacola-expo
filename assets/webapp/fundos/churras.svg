    <rect x="46" y="4" width="4" height="96" rx="2"/>
    <rect x="36" y="16" width="24" height="16" rx="5"/>
    <rect x="38" y="36" width="20" height="12" rx="5"/>
    <rect x="36" y="52" width="24" height="16" rx="5"/>
  </g>
  <!-- garrafa -->
  <g transform="rotate(12 170 50)">
    <rect x="164" y="10" width="12" height="8" rx="2"/>
    <path d="M165 18 h10 v12 q10 8 10 20 v36 a5 5 0 0 1 -5 5 h-20 a5 5 0 0 1 -5 -5 v-36 q0 -12 10 -20 Z"/>
  </g>
  <!-- linguiça -->
