<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Silhuetas de açougue (usadas como máscara; a cor vem do CSS) -->
  <!-- bife -->
  <g transform="rotate(-15 50 50)">
    <path d="M18 44 q4 -26 36 -26 q30 0 34 24 q4 26 -26 34 q-20 6 -30 -6 q-16 -6 -14 -26 z"/>
  </g>
  <!-- linguiça -->
  <g transform="rotate(25 170 50)">
    <rect x="130" y="40" width="80" height="22" rx="11"/>
  </g>
  <!-- coxa de frango -->
  <g transform="rotate(35 70 160)">
    <ellipse cx="60" cy="160" rx="24" ry="30"/>
    <rect x="56" y="186" width="8" height="26" rx="4"/>
    <circle cx="54" cy="214" r="6"/>
    <circle cx="66" cy="214" r="6"/>
  </g>
  <!-- cutelo -->
  <g transform="rotate(-20 170 160)">
    <path d="M140 132 h56 v34 a6 6 0 0 1 -6 6 h-50 z M180 142 a4 4 0 1 0 0.1 0 z" fill-rule="evenodd"/>
    <rect x="196" y="144" width="30" height="10" rx="5"/>
  </g>
  <!-- osso -->
  <g transform="rotate(-30 120 220)">
    <rect x="102" y="214" width="36" height="10" rx="5"/>
    <circle cx="100" cy="214" r="7"/><circle cx="100" cy="224" r="7"/>
    <circle cx="140" cy="214" r="7"/><circle cx="140" cy="224" r="7"/>
  </g>
</svg>
