<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Silhuetas de farmácia (usadas como máscara; a cor vem do CSS) -->
  <!-- cápsula -->
  <g transform="rotate(-35 44 44)">
    <rect x="16" y="32" width="56" height="24" rx="12"/>
  </g>
  <!-- cruz -->
  <path d="M142 20 h16 v18 h18 v16 h-18 v18 h-16 v-18 h-18 v-16 h18 Z"/>
  <!-- comprimidos -->
  <circle cx="212" cy="96" r="11"/>
  <circle cx="190" cy="112" r="8"/>
  <!-- frasco de remédio -->
  <g transform="rotate(10 60 160)">
    <rect x="42" y="124" width="36" height="12" rx="3"/>
    <rect x="44" y="140" width="32" height="52" rx="6"/>
  </g>
  <!-- band-aid -->
  <g transform="rotate(30 150 150)">
    <rect x="118" y="138" width="64" height="24" rx="12"/>
  </g>
  <!-- termômetro -->
  <g transform="rotate(-20 200 200)">
    <rect x="194" y="160" width="12" height="46" rx="6"/>
    <circle cx="200" cy="210" r="11"/>
  </g>
  <!-- coração -->
  <path d="M100 222 l-18 -17 a10 10 0 0 1 18 -12 a10 10 0 0 1 18 12 Z"/>
</svg>
